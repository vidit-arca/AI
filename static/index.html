<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenProject AI Agent</title>
    <link rel="stylesheet" href="/static/style.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <div class="pulse-dot"></div>
                <h1>AI Agent</h1>
            </div>
            <p class="subtitle">Mistral-powered OpenProject Assistant</p>
        </header>
        
        <main class="chat-container" id="chatContainer">
            <div class="message ai-message">
                <div class="avatar">AI</div>
                <div class="bubble">
                    Hello! I'm connected to your OpenProject and ready to help. Try saying something like: <br><br>
                    <em>"Create a normal priority bug in my project to fix the styling on the homepage."</em>
                </div>
            </div>
        </main>
        
        <footer class="input-area">
            <form id="chatForm">
                <textarea id="userInput" placeholder="Ask the agent to create a task..." rows="1"></textarea>
                <div class="form-actions">
                    <button type="button" id="micBtn" title="Use Voice Input">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button type="submit" id="sendBtn" title="Send Message">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </form>
        </footer>
    </div>
    
    <script src="/static/script.js?v=5"></script>
</body>
</html>
